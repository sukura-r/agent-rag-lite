# Agent RAG Lite Redis configuration managed by systemd.
# Install to /etc/redis/agent-rag-lite.conf.
bind 127.0.0.1
protected-mode yes
port 26379
daemonize no
supervised systemd
logfile ""
dir /var/lib/redis-agent-rag-lite
dbfilename agent-rag-lite.rdb
save ""
appendonly no
databases 1
maxmemory 64mb
maxmemory-policy volatile-lru
