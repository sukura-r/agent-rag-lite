name: agent-rag-lite

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: agent_rag
      TZ: Asia/Shanghai
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${MYSQL_PORT:-23306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${REDIS_PORT:-26379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${DOCUMENT_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${DOCUMENT_STORAGE_SECRET_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${HOST_BIND_IP:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  milvus:
    image: milvusdb/milvus:v2.6.6
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${DOCUMENT_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${DOCUMENT_STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${MILVUS_PORT:-19530}:19530"
      - "${HOST_BIND_IP:-127.0.0.1}:${MILVUS_HEALTH_PORT:-9091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx128m -Xmn64m"
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9876'"]
      interval: 5s
      timeout: 3s
      retries: 30

  rocketmq-store-init:
    image: apache/rocketmq:5.3.2
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 3000:3000 /broker-store"]
    volumes:
      - rocketmq-store:/broker-store

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    restart: unless-stopped
    command: sh /home/rocketmq/conf/start-broker.sh
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
      BROKER_ADVERTISED_HOST: ${BROKER_ADVERTISED_HOST:-127.0.0.1}
      BROKER_PORT: ${BROKER_PORT:-10911}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${BROKER_PORT:-10911}:${BROKER_PORT:-10911}"
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/conf/base-broker.conf:ro
      - ./deploy/rocketmq/start-broker.sh:/home/rocketmq/conf/start-broker.sh:ro
      - rocketmq-store:/home/rocketmq/store
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-store-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 | grep -q agent-rag-broker"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 15s

volumes:
  mysql-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
  rocketmq-store:
